---
name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: Lint Go Code
        run: mise run check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: Run golangci-lint
        run: mise run lint

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: Vet Go code
        run: mise run vet

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: Test
        run: mise run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, lint, vet, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v5
      - name: build
        run: mise run build
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
